name: PersonalAIKeyboard
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  PersonalAIKeyboard:
    type: application
    platform: iOS
    sources:
      - Container
      - path: Keyboard
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pindpilot.aikeyboard
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Container/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Keyboard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: AIKeyboardExtension
        embed: true
  AIKeyboardExtension:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pindpilot.aikeyboard.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
  ProviderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pindpilot.aikeyboard.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PersonalAIKeyboard
schemes:
  PersonalAIKeyboard:
    build:
      targets:
        PersonalAIKeyboard: all
        AIKeyboardExtension: all
    test:
      targets: [ProviderTests]
